<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VR Classroom Researcher Console</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #20242a;
      --muted: #68717d;
      --line: #d9dee5;
      --accent: #176c7d;
      --accent-2: #7b4b24;
      --danger: #a23a35;
      --ok: #2b7a4b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    header {
      display: flex;
      gap: 14px;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      position: sticky;
      top: 0;
      z-index: 2;
    }
    h1 {
      font-size: 18px;
      margin: 0;
      font-weight: 700;
    }
    main {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: calc(100vh - 58px);
    }
    aside {
      border-right: 1px solid var(--line);
      padding: 16px;
      background: #fbfcfd;
    }
    section {
      padding: 16px 18px 28px;
    }
    label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin: 12px 0 6px;
    }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 9px 10px;
      background: #fff;
      font-size: 14px;
    }
    textarea {
      min-height: 94px;
      resize: vertical;
      font-family: inherit;
    }
    button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      border-radius: 6px;
      padding: 9px 10px;
      font-size: 14px;
      cursor: pointer;
      text-align: left;
    }
    button:hover { border-color: var(--accent); }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.46;
      background: #f1f3f5;
    }
    button:disabled:hover { border-color: var(--line); }
    button.primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      text-align: center;
      font-weight: 650;
    }
    button.warn {
      border-color: #d6b38d;
      color: var(--accent-2);
    }
    button.danger {
      border-color: #e2b8b6;
      color: var(--danger);
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 13px;
      color: var(--muted);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
    }
    .dot.ok { background: var(--ok); }
    .student-grid,
    .quick-grid,
    .custom-grid,
    .behavior-grid,
    .line-grid {
      display: grid;
      gap: 8px;
    }
    .student-grid { grid-template-columns: 1fr; }
    .quick-grid { grid-template-columns: 1fr; }
    .custom-grid { grid-template-columns: 1fr; max-width: 760px; }
    .behavior-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .line-grid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
    .student {
      border: 2px solid transparent;
    }
    .student.active {
      border-color: var(--accent);
      background: #edf8fa;
    }
    .group {
      margin-bottom: 22px;
    }
    .group h2 {
      margin: 0 0 10px;
      font-size: 15px;
    }
    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      margin-top: 10px;
    }
    .log {
      height: 180px;
      overflow: auto;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 6px;
      padding: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      white-space: pre-wrap;
    }
    @media (max-width: 760px) {
      main { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <header>
    <h1>研究者控制台</h1>
    <div class="status"><span id="dot" class="dot"></span><span id="status">未连接</span></div>
  </header>

  <main>
    <aside>
      <label for="room">Room</label>
      <input id="room" value="demo" />

      <label for="token">Token</label>
      <input id="token" type="password" placeholder="如果服务器设置了 RELAY_TOKEN" />

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px;">
        <button class="primary" id="connect">连接</button>
        <button id="disconnect">断开</button>
      </div>

      <div class="hint">
        Unity 端和此网页必须连接同一个 room。公网部署时建议设置 RELAY_TOKEN。
      </div>

      <label>学生</label>
      <div id="students" class="student-grid"></div>

      <label>快捷控制</label>
      <div class="quick-grid">
        <button class="warn" id="return-lily">莉莉回座位</button>
      </div>

      <label>事件日志</label>
      <div id="log" class="log"></div>
    </aside>

    <section>
      <div class="group">
        <h2>行为按钮</h2>
        <div id="behaviors" class="behavior-grid"></div>
      </div>

      <div class="group">
        <h2>预制台词</h2>
        <div id="lines"></div>
      </div>

      <div class="group">
        <h2>自定义台词</h2>
        <div class="custom-grid">
          <textarea id="custom-text" placeholder="输入想让当前选中学生说的话"></textarea>
          <button class="primary" id="send-custom">发送给当前学生</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const students = [
      { index: 1, name: "莉莉", englishName: "Lily", profile: "student_01_xiaoxiao_girl" },
      { index: 2, name: "卢卡", englishName: "Luca", profile: "student_03_yunjian_boy" },
      { index: 3, name: "贝拉", englishName: "Bella", profile: "student_02_xiaoyi_girl" },
    ];

    const utteranceGroups = {
      "物品回答": [
        ["crab_short", "螃蟹！"],
        ["crab_sentence", "这是螃蟹。"],
        ["jellyfish_short", "水母！"],
        ["jellyfish_sentence", "这是水母。"],
        ["bee_short", "蜜蜂！"],
        ["bee_sentence", "这是蜜蜂。"],
        ["ant_short", "蚂蚁！"],
        ["ant_sentence", "这是蚂蚁。"],
        ["apple_short", "苹果！"],
        ["apple_sentence", "这是苹果。"],
        ["banana_short", "香蕉！"],
        ["banana_sentence", "这是香蕉。"],
        ["strawberry_short", "草莓！"],
        ["strawberry_sentence", "这是草莓。"],
        ["grape_short", "葡萄！"],
        ["grape_sentence", "这是葡萄。"],
      ],
      "不确定/错误": [
        ["uncertain_ruler", "嗯……是尺子吗？"],
        ["uncertain_eraser", "是……橡皮吗？"],
        ["maybe_this", "是这个吗？"],
        ["i_dont_know", "我不知道。"],
        ["i_cannot", "老师，我不会。"],
        ["huh_what", "啊？什么？"],
      ],
      "课堂行为": [
        ["teacher_i_know", "老师老师，我知道！"],
        ["want_to_play", "我想玩那个。"],
        ["he_touched_me", "他碰我。"],
        ["laugh", "哈哈哈。"],
      ],
      "回应": [
        ["okay", "好。"],
        ["okay_teacher", "好的，老师。"],
        ["i_can_do_it", "我会。"],
      ],
    };

    const disabledUtteranceGroups = new Set(["不确定/错误", "课堂行为"]);

    const behaviors = [
      ["raise_hand", "举手", 5, ""],
      ["ask_question", "提问姿态", 5, ""],
      ["clap", "拍手", 3, ""],
      ["touch_nose", "摸鼻子", 3, ""],
      ["distracted", "分心", 6, "warn"],
      ["talk", "和同伴说话", 5, "warn"],
      ["hit_desk", "拍桌", 3, "danger"],
      ["scream", "尖叫动作", 2, "danger"],
      ["lie_down", "趴桌/躺下", 6, "warn"],
      ["recover", "恢复", 2, ""],
      ["stop", "停止当前行为", 1, "danger"],
    ];
    const enabledBehaviorKeys = new Set(["clap", "touch_nose"]);

    let socket = null;
    let selectedStudent = students[0];

    const roomInput = document.getElementById("room");
    const tokenInput = document.getElementById("token");
    const statusEl = document.getElementById("status");
    const dotEl = document.getElementById("dot");
    const logEl = document.getElementById("log");
    const customTextEl = document.getElementById("custom-text");

    roomInput.value = localStorage.getItem("relay.room") || "demo";
    tokenInput.value = localStorage.getItem("relay.token") || "";

    function log(message) {
      const line = `[${new Date().toLocaleTimeString()}] ${message}\n`;
      logEl.textContent = line + logEl.textContent;
    }

    function setStatus(text, ok) {
      statusEl.textContent = text;
      dotEl.classList.toggle("ok", Boolean(ok));
    }

    function wsUrl() {
      const room = encodeURIComponent(roomInput.value || "demo");
      const token = encodeURIComponent(tokenInput.value || "");
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      let target = `${protocol}//${location.host}/ws?role=researcher&room=${room}`;
      if (token) target += `&token=${token}`;
      return target;
    }

    function connect() {
      localStorage.setItem("relay.room", roomInput.value || "demo");
      localStorage.setItem("relay.token", tokenInput.value || "");

      if (socket) socket.close();
      socket = new WebSocket(wsUrl());
      setStatus("连接中", false);

      socket.addEventListener("open", () => {
        setStatus("已连接", true);
        send({ type: "hello", client: "researcher" });
        sendStudentSelection();
        log("connected");
      });

      socket.addEventListener("message", (event) => {
        log(`recv ${event.data}`);
      });

      socket.addEventListener("close", () => {
        setStatus("已断开", false);
        log("disconnected");
      });

      socket.addEventListener("error", () => {
        setStatus("连接错误", false);
        log("websocket error");
      });
    }

    function disconnect() {
      if (socket) socket.close();
      socket = null;
      setStatus("已断开", false);
    }

    function send(payload) {
      if (!socket || socket.readyState !== WebSocket.OPEN) {
        log("not connected");
        return;
      }
      socket.send(JSON.stringify(payload));
    }

    function sendPreset(utteranceKey, text) {
      send({
        type: "preset_line",
        studentIndex: selectedStudent.index,
        voiceProfileId: selectedStudent.profile,
        utteranceKey,
        text,
        timestamp: Date.now() / 1000,
      });
      log(`sent ${selectedStudent.name}: ${text}`);
    }

    function sendBehavior(behavior, duration) {
      send({
        type: "behavior",
        studentIndex: selectedStudent.index,
        behavior,
        duration,
        timestamp: Date.now() / 1000,
      });
      log(`sent behavior ${selectedStudent.name}: ${behavior}`);
    }

    function sendLilyReturnSeat() {
      send({
        type: "behavior",
        studentIndex: 1,
        behavior: "return_seat",
        duration: 2,
        timestamp: Date.now() / 1000,
      });
      log("sent behavior 莉莉: return_seat");
    }

    function sendCustomText() {
      const text = customTextEl.value.trim();
      if (!text) {
        log("custom text is empty");
        return;
      }

      send({
        type: "custom_text",
        studentIndex: selectedStudent.index,
        voiceProfileId: selectedStudent.profile,
        text,
        timestamp: Date.now() / 1000,
      });
      log(`sent custom text ${selectedStudent.name}: ${text}`);
      customTextEl.value = "";
    }

    function sendStudentSelection() {
      send({
        type: "select_student",
        studentIndex: selectedStudent.index,
        voiceProfileId: selectedStudent.profile,
        text: selectedStudent.name,
        timestamp: Date.now() / 1000,
      });
      log(`selected ${selectedStudent.name}`);
    }

    function renderStudents() {
      const container = document.getElementById("students");
      container.innerHTML = "";

      for (const student of students) {
        const button = document.createElement("button");
        button.className = "student" + (student.index === selectedStudent.index ? " active" : "");
        button.textContent = `${student.index}. ${student.name}`;
        button.addEventListener("click", () => {
          selectedStudent = student;
          renderStudents();
          sendStudentSelection();
        });
        container.appendChild(button);
      }
    }

    function renderBehaviors() {
      const container = document.getElementById("behaviors");
      container.innerHTML = "";

      for (const [key, label, duration, cls] of behaviors) {
        const button = document.createElement("button");
        button.className = cls;
        button.textContent = label;
        button.disabled = !enabledBehaviorKeys.has(key);
        button.addEventListener("click", () => sendBehavior(key, duration));
        container.appendChild(button);
      }
    }

    function renderLines() {
      const container = document.getElementById("lines");
      container.innerHTML = "";

      for (const [groupName, lines] of Object.entries(utteranceGroups)) {
        const group = document.createElement("div");
        group.className = "group";
        const heading = document.createElement("h2");
        heading.textContent = groupName;
        const grid = document.createElement("div");
        grid.className = "line-grid";

        for (const [key, text] of lines) {
          const button = document.createElement("button");
          button.textContent = text;
          button.title = key;
          button.disabled = disabledUtteranceGroups.has(groupName);
          button.addEventListener("click", () => sendPreset(key, text));
          grid.appendChild(button);
        }

        group.appendChild(heading);
        group.appendChild(grid);
        container.appendChild(group);
      }
    }

    document.getElementById("connect").addEventListener("click", connect);
    document.getElementById("disconnect").addEventListener("click", disconnect);
    document.getElementById("return-lily").addEventListener("click", sendLilyReturnSeat);
    document.getElementById("send-custom").addEventListener("click", sendCustomText);
    customTextEl.addEventListener("keydown", (event) => {
      if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
        event.preventDefault();
        sendCustomText();
      }
    });

    renderStudents();
    renderBehaviors();
    renderLines();
  </script>
</body>
</html>
